name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.2.0；留空则使用 0.0.<运行序号>）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          WISLAND_OSS_DOWNLOAD_BASE: ${{ vars.WISLAND_OSS_DOWNLOAD_BASE }}
          WISLAND_UPDATE_PUBLIC_KEY: ${{ vars.WISLAND_UPDATE_PUBLIC_KEY }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ($env:REQUESTED_VERSION) {
            $version = $env:REQUESTED_VERSION.TrimStart("v")
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -cnotmatch '^(0|[1-9][0-9]{0,8})(\.(0|[1-9][0-9]{0,8})){2}\z') {
            throw "版本号应为 x.y.z"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          $releaseInfo = Join-Path $env:RUNNER_TEMP "release-info.json"
          @{ version = $version; download_base = [string]$env:WISLAND_OSS_DOWNLOAD_BASE; update_public_key = [string]$env:WISLAND_UPDATE_PUBLIC_KEY } |
            ConvertTo-Json -Compress | Set-Content -LiteralPath $releaseInfo -Encoding utf8
          "WISLAND_RELEASE_INFO=$releaseInfo" >> $env:GITHUB_ENV

      - name: Build (onedir + onefile)
        run: pyinstaller --noconfirm --clean packaging/wisland.spec

      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          WISLAND_EXPECT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $p = Start-Process -FilePath "dist\Wisland\Wisland.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path "dist\Wisland\data\selfcheck.txt") { Get-Content "dist\Wisland\data\selfcheck.txt" }
            throw "onedir 冒烟检查失败（exit $($p.ExitCode)）"
          }
          $p = Start-Process -FilePath "dist\Wisland-onefile.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path "dist\data\selfcheck.txt") { Get-Content "dist\data\selfcheck.txt" }
            throw "onefile 冒烟检查失败（exit $($p.ExitCode)）"
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item README.md, LICENSE dist/Wisland/
          # 冒烟检查会在程序目录生成默认 config.json 和 data；首次运行时应用会自己创建，不随包发布
          Remove-Item "dist\Wisland\config.json", "dist\Wisland\data" -Recurse -Force -ErrorAction SilentlyContinue
          Rename-Item "dist\Wisland-onefile.exe" "Wisland-$v.exe"
          Push-Location dist/Wisland
          7z a -tzip -mx=5 "../wisland-$v.zip" *
          Pop-Location
          Get-ChildItem dist -File | Select-Object Name, @{n="MB"; e={[math]::Round($_.Length / 1MB, 1)}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wisland-${{ steps.ver.outputs.version }}
          path: |
            dist/wisland-*.zip
            dist/Wisland-*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Wisland ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wisland-*.zip
            dist/Wisland-*.exe

  mirror-oss:
    if: ${{ vars.WISLAND_OSS_DOWNLOAD_BASE != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: wisland-oss-mirror
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wisland-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Install OSS SDK
        run: python -m pip install alibabacloud-oss-v2==1.3.2 "cryptography>=44"
      - name: Publish OSS mirror
        env:
          WISLAND_RELEASE_VERSION: ${{ needs.build.outputs.version }}
          WISLAND_OSS_BUCKET: ${{ vars.WISLAND_OSS_BUCKET }}
          WISLAND_OSS_REGION: ${{ vars.WISLAND_OSS_REGION }}
          WISLAND_OSS_UPLOAD_ORIGIN: ${{ vars.WISLAND_OSS_UPLOAD_ORIGIN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          WISLAND_UPDATE_PRIVATE_KEY: ${{ secrets.WISLAND_UPDATE_PRIVATE_KEY }}
          WISLAND_UPDATE_PUBLIC_KEY: ${{ vars.WISLAND_UPDATE_PUBLIC_KEY }}
        run: python -m scripts.publish_oss
